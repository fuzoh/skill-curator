# cargo-mutants configuration (consultative check, never a PR gate).
#
# Mutation testing is targeted at safety-critical modules only: path
# validation (symlinks, path traversal), overwrite protection, Revision
# selection, and update conflict handling. When a change introduces or moves
# such a module, list its files here in the same change. The consultative
# workflow fails when these globs select no mutant, so a stale list (or one
# written before the modules exist) is reported instead of passing silently.
#
# Run it only in a disposable environment without personal data or
# credentials: a mutated deletion path can escape its temporary directory.
# See CONTRIBUTING.md.
examine_globs = [
    # Path validation (symlinks, path traversal) and overwrite protection.
    "src/safety.rs",
    "src/safety/**/*.rs",
    # Symlink and special-file refusal while hashing a Skill directory.
    "src/hash.rs",
    # Symlink checks on Collection files and Destination path checks (home
    # directory, Collection root, enabled Destinations inside one another).
    "src/collection.rs",
    "src/collection/machine.rs",
    # Revision selection, unreachable Revisions, strict Skill extraction
    # (symlink, path traversal, and `.git` refusal), safe `git` invocation,
    # and license detection.
    "src/source.rs",
    "src/source/**/*.rs",
    # Deterministic Adaptation: refusal of symbolic links, special files, and
    # unsafe paths in Skill trees, the mandatory `SKILL.md` check, and D2
    # file selection.
    "src/adaptation.rs",
    "src/adaptation/files.rs",
    # Overwrite protection of manual edits in `skills/` and the staged swap
    # of Skill directories.
    "src/materialize.rs",
    # Update conflict handling.
    "src/conflict.rs",
    "src/conflict/**/*.rs",
]
