# cargo-deny policy for skill-curator's own Rust dependency graph.
#
# Scope: the crates compiled into this MIT-licensed tool and the crates used to
# build and test it. This policy does NOT cover downloaded Skills: their
# licenses are third-party content handled by the tool's own provenance
# workflow (`lock.toml`, `ATTRIBUTION.md`).
#
# Every entry below was chosen deliberately; it is not `cargo deny init`
# output. Changing it requires the same review as code: state the reason in
# the commit message and, for exceptions, in an inline comment.

[graph]
# Platforms the tool is built for. Dependencies that only apply to other
# targets are ignored.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# Any RustSec advisory on a dependency fails the check, including unmaintained
# and unsound crates. Ignoring one requires an entry with `reason` and
# `expiry`, for example:
#   { id = "RUSTSEC-0000-0000", reason = "...", expiry = "2027-01-31" }
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []
unused-ignored-advisory = "deny"

[licenses]
# Permissive licenses compatible with distributing an MIT-licensed binary.
# Copyleft licenses are not allowed. A crate offering a choice (for example
# `MIT OR Apache-2.0`) passes when one allowed option is available.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
]
# Test and build tooling is audited too, so the whole repository stays under
# the same reviewed policy.
include-dev = true
include-build = true
confidence-threshold = 0.93
unused-allowed-license = "warn"
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Encodes design boundaries from docs/v1-spec.md:
# - Sources are fetched with the system `git` binary, never an embedded Git.
# - The tool never calls a model API directly, so it needs no HTTP client.
deny = [
    { crate = "git2", reason = "Sources are fetched with the system git binary" },
    { crate = "libgit2-sys", reason = "Sources are fetched with the system git binary" },
    { crate = "gix", reason = "Sources are fetched with the system git binary" },
    { crate = "reqwest", reason = "the tool never calls a model or registry HTTP API" },
    { crate = "ureq", reason = "the tool never calls a model or registry HTTP API" },
    { crate = "hyper", reason = "the tool never calls a model or registry HTTP API" },
    { crate = "curl", reason = "the tool never calls a model or registry HTTP API" },
]

[sources]
# Only crates.io; no git or alternative-registry dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
